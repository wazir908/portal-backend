services:
  - type: web
    name: bodf-whatsapp
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: whatsapp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: DATA_DIR
        value: /var/data
      - key: SUPABASE_URL
        value: https://pjqiaprsgwdkpgmdayif.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
